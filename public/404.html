<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Genovo Technologies</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // If the user went to /clickup or /clickup/, redirect to /clickup/index.html or /#/clickup
        if (path === '/clickup' || path === '/clickup/') {
          window.location.replace('/clickup/index.html' + search + hash);
          return;
        }

        // Standard SPA redirect for HashRouter:
        // /products/synthos -> /#/products/synthos
        var cleanPath = path;
        // Strip repo base path if hosted on github.io subpath (e.g. /website/)
        if (cleanPath.indexOf('/website') === 0) {
          cleanPath = cleanPath.substring('/website'.length);
        }
        if (!cleanPath || cleanPath === '/') {
          cleanPath = '';
        }

        var target = (window.location.pathname.indexOf('/website') === 0 ? '/website/#' : '/#') + cleanPath + search + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="background: #050505; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Genovo Technologies...</p>
  </body>
</html>
